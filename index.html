<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sodiq Olamide | Web Developer</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- ✅ ADDED (for real tech icons) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">

  <style>
    body {
      font-family: 'Outfit', sans-serif;
      margin: 0;
      background: #0a0a0a;
      color: #fff;
    }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }

    /* ✅ UPDATED skill-item ONLY */
    .skill-item {
      background: #1a1a1a;
      padding: 10px;
      border-radius: 8px;
      text-align: center;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .skill-item i {
      font-size: 20px;
    }
  </style>
</head>

<body>

<section id="skills">
  <h3>What I Work With</h3>

  <div class="skills-grid">

    <div class="skill-item">
      <i class="devicon-html5-plain colored"></i> HTML5
    </div>

    <div class="skill-item">
      <i class="devicon-css3-plain colored"></i> CSS3
    </div>

    <div class="skill-item">
      <i class="devicon-javascript-plain colored"></i> JavaScript
    </div>

    <div class="skill-item">
      <i class="devicon-bootstrap-plain colored"></i> Bootstrap
    </div>

    <div class="skill-item">
      <i class="devicon-react-original colored"></i> React
    </div>

    <div class="skill-item">
      <i class="devicon-tailwindcss-plain colored"></i> Tailwind CSS
    </div>

    <div class="skill-item">
      <i class="devicon-nodejs-plain colored"></i> Node.js
    </div>

    <div class="skill-item">
      <i class="devicon-express-original"></i> Express.js
    </div>

    <div class="skill-item">
      <i class="devicon-mongodb-plain colored"></i> MongoDB
    </div>

    <div class="skill-item">
      <i class="fas fa-server"></i> REST APIs
    </div>

    <div class="skill-item">
      <i class="devicon-git-plain colored"></i> Git
    </div>

    <div class="skill-item">
      <i class="devicon-github-original"></i> GitHub
    </div>

    <div class="skill-item">
      <i class="devicon-postman-plain colored"></i> Postman
    </div>

    <div class="skill-item">
      <i class="fas fa-mobile-alt"></i> Responsive Design
    </div>

  </div>
</section>

</body>
</html>
